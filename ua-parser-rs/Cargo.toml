[package]
name = "ua-parser-rs"
version = "0.1.6"
edition = "2024"
license = "Apache 2.0"
description = "A native accelerator for uap-python"
repository = "https://github.com/ua-parser/uap-python/"
homepage = "https://github.com/ua-parser/uap-python/blob/master/ua-parser-rs/"
authors = ["masklinn <uap@masklinn.net>"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "ua_parser_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3", "abi3-py310", "abi3t", "abi3t-py315"] }
ua-parser = "0.2.2"
