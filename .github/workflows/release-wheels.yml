name: Wheels

on:
  pull_request:
    types: [opened, reopened, labeled, synchronize]
  workflow_dispatch:
    inputs:
      release:
        description: 'Push wheels to pypi'
        type: boolean
        default: false
        required: true
      update:
        description: "Update existing release"
        type: boolean
        default: false
        required: true

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  py-generate-matrix:
    name: "generate build matrix"
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
          github.event_name == 'pull_request' &&
          github.event.type == 'labeled' &&
          github.event.label.name == 'check-wheels'
      ) ||
      (
          github.event_name == 'pull_request' &&
          github.event.type != 'labeled' &&
          contains(github.event.pull_request.labels.*.name, 'check-wheels')
      )
    outputs:
      wheels: ${{ steps.make-matrix-wheels.outputs.matrix }}
      tests: ${{ steps.make-matrix-tests.outputs.matrix }}
    steps:
      - id: download-matrix-scripts
        name: retrieve matrix scripts
        run: |
          curl -fsSL \
              -O https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/matrix-wheels.py \
              -O https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/matrix-tests.py
      - id: make-matrix-wheels
        name: generate wheels matrix
        run: |
          echo -n "matrix=" >> $GITHUB_OUTPUT
          python3 matrix-wheels.py | tee -a $GITHUB_OUTPUT | jq "."
      - id: make-matrix-tests
        name: generate tests matrix
        run: |
          echo -n "matrix=" >> $GITHUB_OUTPUT
          python3 matrix-tests.py | tee -a $GITHUB_OUTPUT | jq "."
  py-release-wheels:
    needs: [py-generate-matrix]
    strategy:
      matrix: ${{ fromJson(needs.py-generate-matrix.outputs.wheels) }}

    runs-on: ${{ matrix.runs }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - if: (matrix.setup-rust)
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          args: --release --out dist -m ua-parser-rs/Cargo.toml -i python ${{ matrix.args }}
          sccache: 'true'
          manylinux: ${{ matrix.manylinux }}
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ua-parser-rs-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.python-version }}.whl
          path: dist/*
          retention-days: 1
          compression-level: 0

  py-release-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          command: sdist
          args: --out dist -m ua-parser-rs/Cargo.toml
      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wheels-sdist
          path: dist

  py-release-tests:
    needs: [py-generate-matrix, py-release-wheels]
    strategy:
      matrix: ${{ fromJson(needs.py-generate-matrix.outputs.tests) }}

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout working copy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          freethreaded: ${{ endsWith(matrix.python-version, 't') }}
      - name: Retrieve wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # 8.0.1
        with:
          name: ua-parser-rs-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.wheel }}.whl
          path: dist
      - name: Update pip
        run: python -mpip install --upgrade pip
      - name: Maybe install libyaml-dev
        if: startsWith(matrix.runs, 'ubuntu-latest')
        run: |
          # if binary wheels are not available for the current
          # package install libyaml-dev so we can install pyyaml
          # from source
          if ! pip download --only-binary :all: pyyaml > /dev/null 2>&1; then
              sudo apt install libyaml-dev
          fi
      - name: Install test dependencies
        run: python -mpip install pytest pyyaml pytest-error-for-skips
      - name: Install wheel
        run: python -mpip install --only-binary ':all:' --no-index --find-links dist ua_parser_rs
      - name: Install package
        run: python -mpip install .
      - name: Run tests
        run: python ${{ matrix.opts }} -m pytest -v -Werror -Wignore::ImportWarning --doctest-glob="*.rst" -ra --error-for-skips -k '(-regex)'

  py-release:
    name: Release
    runs-on: ubuntu-latest
    needs: [py-release-tests, py-release-sdist]
    if: github.event_name == 'workflow_dispatch'
    permissions:
      id-token: write
    environment: release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # 8.0.1
        with:
          path: dist/
          merge-multiple: true  # dump every wheel file in the same directory
      - name: Publish to PyPI
        if: (inputs.release)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          verbose: true
          skip-existing: ${{ inputs.update }}
      - name: Publish to TestPyPI
        if: (!inputs.release)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          verbose: true
