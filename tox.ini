[tox]
min_version = 4.0
env_list = py3{10,11,12,13,14,14t,15,15t}
           pypy{311,312}
           graalpy313
           check, format, typecheck

[testenv]
labels = test
# wheel install
package = wheel
# wheel is universal so can use the same wheel for all envs
wheel_build_env = .pkg
# for extra deps
# extras =
allowlist_externals = cargo
deps =
     pytest
     pyyaml
     ./ua-parser-rs
     ./ua-parser-builtins
commands =
    pytest -Werror --doctest-glob="*.rst" {posargs}

# versions with re2 support
[testenv:py3{10,11,12,13,14}]
labels = test, cpy
deps =
     pytest
     pyyaml
     google-re2
     ./ua-parser-rs
     ./ua-parser-builtins

[testenv:check]
labels = check
package = skip
deps = ruff
commands =
    cargo clippy --manifest-path ua-parser-rs/Cargo.toml {posargs}
    ruff check {posargs}

[testenv:format]
description = Runs the formatter (just showing errors by default)
labels = check
package = skip
deps = ruff
commands =
    cargo fmt --manifest-path ua-parser-rs/Cargo.toml {posargs:--check}
    ruff format {posargs:--diff}

[testenv:typecheck]
labels = check
package = skip
deps =
     mypy
     types-PyYaml
     ./ua-parser-rs
     ./ua-parser-builtins
commands =
    cargo check --manifest-path ua-parser-rs/Cargo.toml
    mypy {posargs}

[testenv:docs]
description = Builds the documentation
labels =
package = skip
deps = sphinx
commands = sphinx-build -M {posargs:html} doc docs/_build
